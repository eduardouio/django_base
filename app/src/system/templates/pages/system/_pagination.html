{% if is_paginated %}
<div class="flex justify-center mt-6">
	<div class="join">
		{% if page_obj.has_previous %}
			<a class="join-item btn btn-sm" href="?{% if querystring %}{{ querystring }}&{% endif %}page=1">«</a>
			<a class="join-item btn btn-sm" href="?{% if querystring %}{{ querystring }}&{% endif %}page={{ page_obj.previous_page_number }}">‹</a>
		{% endif %}
		<span class="join-item btn btn-sm btn-active pointer-events-none">Página {{ page_obj.number }} de {{ page_obj.paginator.num_pages }}</span>
		{% if page_obj.has_next %}
			<a class="join-item btn btn-sm" href="?{% if querystring %}{{ querystring }}&{% endif %}page={{ page_obj.next_page_number }}">›</a>
			<a class="join-item btn btn-sm" href="?{% if querystring %}{{ querystring }}&{% endif %}page={{ page_obj.paginator.num_pages }}">»</a>
		{% endif %}
	</div>
</div>
{% endif %}
