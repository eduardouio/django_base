<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>{{ subject }}</title>
</head>
<body style="margin:0;padding:0;background-color:#f1f5f9;font-family:Arial,Helvetica,sans-serif;color:#1e293b;">
	<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f1f5f9;padding:24px 0;">
		<tr>
			<td align="center">
				<table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px;width:100%;background-color:#ffffff;border-radius:8px;overflow:hidden;">
					<tr>
						<td style="background-color:#0f172a;padding:20px 32px;">
							<img src="{{ site_url }}/static/img/logo.png" alt="{{ site_name }}" height="36" style="display:inline-block;vertical-align:middle;border:0;">
							<span style="color:#ffffff;font-size:18px;font-weight:bold;vertical-align:middle;margin-left:8px;">{{ site_name }}</span>
						</td>
					</tr>
					<tr>
						<td style="padding:32px;font-size:15px;line-height:1.6;">
							{% block content %}{% endblock %}
						</td>
					</tr>
					<tr>
						<td style="padding:16px 32px;background-color:#f8fafc;color:#64748b;font-size:12px;text-align:center;">
							{% block footer %}Este es un correo automático de {{ site_name }}, por favor no respondas a este mensaje.{% endblock %}
						</td>
					</tr>
				</table>
			</td>
		</tr>
	</table>
</body>
</html>
