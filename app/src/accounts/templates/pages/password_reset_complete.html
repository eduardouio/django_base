{% extends 'base/auth_card.html' %}

{% block title %}Contraseña actualizada{% endblock %}
{% block card_title %}<i class="las la-check-circle"></i> Contraseña actualizada{% endblock %}

{% block card_body %}
<div class="alert alert-success text-sm">
  <i class="las la-check-circle text-xl"></i>
  <span>Tu contraseña se cambió correctamente. Ya puedes iniciar sesión con ella.</span>
</div>
<a href="{% url 'accounts:login' %}" class="btn btn-neutral w-full gap-2 normal-case mt-6"><i class="las la-sign-in-alt"></i> Iniciar sesión</a>
{% endblock %}
